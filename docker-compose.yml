services:
  zaoba:
    # 直接用 Docker Hub 现成镜像（推荐）；想改源码自己构建则取消下面 build 那行注释
    image: hitaoge/zaoba:latest
    # build: .
    container_name: zaoba
    restart: unless-stopped
    ports:
      - "7788:7788"
    environment:
      TZ: Asia/Shanghai
      # ZAOBA_PORT: 7788        # 容器内监听端口（默认 7788）
      # CHECKIN_ONLY: zhipu     # 只跑指定平台（逗号分隔）
      # CHECKIN_NO_DELAY: "1"   # 关闭随机延迟（补跑/调试用）
      # 远程接管：签装在局域网内 Windows 电脑上的客户端（Trae/WorkBuddy/豆包工作）
      # 值填那台电脑的局域网 IP，见 docs/DOCKER.md「远程接管」章节
      # ZAOBA_CDP_HOST: 192.168.1.100
    volumes:
      # 方式 A：命名卷（推荐，权限自动处理）
      - zaoba-data:/data
      # 方式 B：绑定宿主机目录（登录态直接复用宿主机 ~/.zaoba/profile 时用）
      # - ./docker-data:/data
    # 主机资源紧张时可限制
    # mem_limit: 2g

volumes:
  zaoba-data:
